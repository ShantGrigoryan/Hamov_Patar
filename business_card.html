<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои Соцсети</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Фоновые пятна ── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: rgba(99, 66, 255, 0.18);
      top: -100px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: rgba(255, 66, 130, 0.12);
      bottom: -80px; right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 500px;
    }

    /* ── Логотип ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6342ff, #ff4282);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 40px rgba(99, 66, 255, 0.45);
    }

    .logo-name {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .logo-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }

    /* ── Сетка кнопок ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      text-decoration: none;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      background: rgba(255,255,255,0.11);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon svg {
      width: 26px;
      height: 26px;
    }

    /* Цвета иконок */
    .ig  { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .fb  { background: #1877f2; }
    .tt  { background: #010101; border: 1px solid rgba(255,255,255,0.15); }
    .gm  { background: #ffffff; }
    .ym  { background: #fc3f1d; }
    .ph  { background: #34a853; }

    .btn-label {
      color: rgba(255,255,255,0.85);
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ЛОГОТИП -->
    <div class="logo-wrap">
      <div class="logo-circle">🌟</div>
      <div class="logo-name">Ваше Имя</div>
      <div class="logo-desc">Краткое описание · Город</div>
    </div>

    <!-- КНОПКИ 3 в ряд -->
    <div class="grid">

      <!-- Instagram -->
      <a href="https://instagram.com/YOUR_USERNAME" class="btn" target="_blank">
        <div class="btn-icon ig">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="white" stroke="none"/>
          </svg>
        </div>
        <span class="btn-label">Instagram</span>
      </a>

      <!-- Facebook -->
      <a href="https://facebook.com/YOUR_USERNAME" class="btn" target="_blank">
        <div class="btn-icon fb">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </div>
        <span class="btn-label">Facebook</span>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@YOUR_USERNAME" class="btn" target="_blank">
        <div class="btn-icon tt">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/>
          </svg>
        </div>
        <span class="btn-label">TikTok</span>
      </a>

      <!-- Google Maps -->
      <a href="https://maps.google.com/?q=YOUR_LOCATION" class="btn" target="_blank">
        <div class="btn-icon gm">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" fill="#4285f4" stroke="#4285f4"/>
            <circle cx="12" cy="10" r="3" fill="white" stroke="none"/>
          </svg>
        </div>
        <span class="btn-label">Google Карты</span>
      </a>

      <!-- Яндекс Карты -->
      <a href="https://yandex.ru/maps/" class="btn" target="_blank">
        <div class="btn-icon ym">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" fill="white" stroke="white"/>
            <circle cx="12" cy="10" r="3" fill="#fc3f1d" stroke="none"/>
          </svg>
        </div>
        <span class="btn-label">Яндекс Карты</span>
      </a>

      <!-- Телефон -->
      <a href="tel:+70000000000" class="btn">
        <div class="btn-icon ph">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2.69h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l1.28-1.28a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <span class="btn-label">Позвонить</span>
      </a>

    </div>
  </div>

</body>
</html>
